<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- N7 — title dan description wajib memuat nama badan usaha. -->
    <title>CV Citra Teknologi Nusantara — Sistem Informasi & Aplikasi Web</title>
    <meta
      name="description"
      content="CV Citra Teknologi Nusantara membangun dan merawat sistem informasi dan aplikasi web untuk instansi dan perusahaan. Badan usaha resmi, data legalitas tercantum."
    />

    <!--
      N8 — Open Graph. Wajib, dan bukan detail kosmetik:
      persona P1 dan P3 kemungkinan besar menerima domain ini LEWAT WHATSAPP.
      Tautan tanpa pratinjau terbaca seperti tautan mencurigakan, dan itu
      membatalkan seluruh kerja blok legalitas sebelum halaman sempat dibuka.

      GANTI G-8 — og:url dan canonical harus URL absolut dengan domain
      final. Nilai di bawah masih domain sementara.

      GANTI G-6 — public/og.png sudah terpasang (1200×630, tipografi saja).
      Ganti begitu logo asli jadi. Pratinjau WhatsApp memotong tepinya,
      jadi jangan taruh apa pun yang penting di 60px terluar.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="CV Citra Teknologi Nusantara" />
    <meta
      property="og:title"
      content="CV Citra Teknologi Nusantara — Sistem Informasi & Aplikasi Web"
    />
    <meta
      property="og:description"
      content="Membangun dan merawat sistem informasi dan aplikasi web untuk instansi dan perusahaan. Badan usaha resmi, data legalitas tercantum."
    />
    <meta property="og:url" content="https://citrateknologi.co.id/" />
    <meta property="og:image" content="https://citrateknologi.co.id/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="CV Citra Teknologi Nusantara — badan usaha resmi, sistem informasi dan aplikasi web"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://citrateknologi.co.id/" />

    <!--
      GANTI G-6 — favicon. Yang terpasang sekarang penampung polos; ganti
      dengan logo asli. apple-touch-icon sengaja belum dipasang: menunjuk ke
      berkas PNG yang belum ada cuma menghasilkan 404.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Font di-host sendiri (lihat src/fonts.css). Preload supaya berkasnya
      mulai diunduh bersamaan dengan CSS, bukan menunggu CSS selesai diurai.
    -->
    <link
      rel="preload"
      href="/fonts/dm-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!--
      Isi <div id="root"> disuntik saat build oleh scripts/prerender.mjs.
      Jangan hapus penanda di bawah — build akan berhenti kalau tidak ketemu.
    -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
